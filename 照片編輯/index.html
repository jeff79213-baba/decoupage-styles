<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="照片編輯">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f0f0f">
<link rel="manifest" href="manifest.json">
<title>照片編輯 - AutoCAD 工具列</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overscroll-behavior:none;touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#0f0f0f;color:#e8e8e8;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
canvas{touch-action:none}
/* Top bar */
.topbar{height:44px;min-height:44px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;justify-content:space-between;padding:0 10px;gap:8px}
.topbar-left{display:flex;align-items:center;gap:8px}
.topbar h1{font-size:15px;font-weight:700;margin:0;letter-spacing:1px}
.topbar-right{display:flex;gap:6px;align-items:center}
.btn-sm{border:1px solid #333;background:#222;color:#ccc;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.btn-sm:active{background:#333}
.btn-sm:disabled{opacity:.35}
.btn-primary{border:none;background:#0ea5e9;color:#fff;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer}
.btn-primary:active{background:#0284c7}
/* Stage */
#stage{flex:1;position:relative;overflow:auto;background:#111;display:flex;align-items:center;justify-content:center;padding:8px;touch-action:none}
#stage.zoomed{justify-content:flex-start;align-items:flex-start}
#canvasWrap{position:relative;max-width:100%;max-height:100%;box-shadow:0 8px 32px rgba(0,0,0,.6);background:#222;border-radius:4px;overflow:hidden}
#mainCanvas{display:block;max-width:100%;max-height:100%;background:#fff}
#overlayCanvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#cropBox{position:absolute;border:2px dashed #0ea5e9;background:rgba(14,165,233,.12);display:none;pointer-events:none}
.handle{position:absolute;width:18px;height:18px;background:#0ea5e9;border:2px solid #fff;border-radius:50%;pointer-events:auto;touch-action:none}
.handle.edge{background:#fff;border-color:#0ea5e9;width:22px;height:14px;border-radius:7px}
.handle.edge.v{width:14px;height:22px}
#layerBox{position:absolute;border:2px solid #fff;display:none;pointer-events:none;box-shadow:0 0 0 1px #0ea5e9, 0 0 18px rgba(14,165,233,.85), inset 0 0 0 1px rgba(255,255,255,.9);background:rgba(255,255,255,.10);mix-blend-mode:normal}
#layerBox::after{content:"";position:absolute;inset:-2px;border:1px dashed rgba(255,255,255,.9);pointer-events:none}
#zoomBar{display:none}
.empty-hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#888;text-align:center;padding:20px}
.empty-hint .big{font-size:44px}
.empty-hint p{margin:0;font-size:14px;line-height:1.5}
.empty-hint button{border:none;background:#0ea5e9;color:#fff;padding:10px 22px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer}
/* Sub bar */
#subBar{min-height:0;background:#1e1e1e;border-top:1px solid #2a2a2a;display:none;flex-wrap:wrap;gap:8px;padding:8px 10px;align-items:center}
#subBar.show{display:flex}
#subBar label{font-size:12px;color:#aaa}
#subBar input[type=color]{width:32px;height:32px;border:none;border-radius:6px;padding:0;background:transparent;cursor:pointer}
#subBar input[type=range]{width:110px}
#subBar select{border:1px solid #333;background:#222;color:#e8e8e8;border-radius:6px;padding:6px 8px;font-size:13px}
#subBar input[type=text]{border:1px solid #333;background:#111;color:#e8e8e8;border-radius:6px;padding:6px 10px;font-size:14px;min-width:140px}
/* Bottom toolbar - AutoCAD style */
#toolBar{background:#181818;border-top:1px solid #2a2a2a;padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:flex-start;max-height:46%;overflow-y:auto}
.tool-btn{flex:0 0 calc(25% - 6px);min-width:0;height:62px;border:1px solid #2a2a2a;background:#222;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;position:relative;padding:4px 2px}
.tool-btn:active{background:#2a2a2a}
.tool-btn.active{border-color:#0ea5e9;background:#0ea5e9;color:#fff}
.tool-btn.active .tool-icon{filter:none}
.tool-btn:disabled{opacity:.35;pointer-events:none}
.tool-icon{font-size:20px;line-height:1}
.tool-label{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;text-align:center}
.tool-dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:#22c55e;display:none}
.tool-btn.has-content .tool-dot{display:block}
/* Landscape */
@media (orientation: landscape) and (max-height: 500px){
  #toolBar{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;justify-content:flex-start;gap:6px;padding-bottom:6px}
  .tool-btn{flex:0 0 78px}
  #stage{padding:4px}
}
/* Portrait larger screens keep 4 cols, small screens also 4 */
@media (min-width: 500px) and (orientation: portrait){
  .tool-btn{flex:0 0 calc(16.66% - 6px)}
}
/* Modal */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-mask.show{display:flex}
.modal{background:#1e1e1e;border:1px solid #333;border-radius:16px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:16px}
.modal h3{margin:0 0 10px;font-size:16px}
.modal p{margin:0 0 12px;color:#aaa;font-size:13px;line-height:1.5}
.grid-pick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0}
.pick-card{border:2px solid #333;border-radius:12px;padding:10px;background:#222;cursor:pointer;text-align:center}
.pick-card.selected{border-color:#0ea5e9;background:#0f2a3a}
.pick-card .prev{height:72px;background:#111;border-radius:8px;display:flex;gap:2px;padding:4px;margin-bottom:6px}
.pick-card .prev div{flex:1;background:#444;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#aaa}
.pick-card h4{margin:0;font-size:13px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.range-val{font-size:12px;color:#0ea5e9;min-width:36px;text-align:right}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:#222;border:1px solid #333;color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <div style="width:28px;height:28px;border-radius:7px;background:#0ea5e9;display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="1.8"/><path d="M21 15l-5-5L5 21"/></svg></div>
    <h1>照片編輯</h1>
    <span id="sizeLabel" style="font-size:11px;color:#777;margin-left:4px"></span>
  </div>
  <div class="topbar-right">
    <button class="btn-sm" id="btnUndo" disabled>↩ 上一步</button>
    <button class="btn-sm" id="btnRedo" disabled>↪ 重做</button>
    <button class="btn-sm" id="btnReset">重置</button>
    <button class="btn-sm" id="btnFullscreen">⛶ 全螢幕</button>
    <button class="btn-primary" id="btnExportTop">輸出</button>
  </div>
</div>

<div id="stage">
  <div id="canvasWrap">
    <canvas id="mainCanvas" width="800" height="600"></canvas>
    <canvas id="overlayCanvas"></canvas>
    <div id="cropBox"><div class="handle" data-dir="nw" style="left:-9px;top:-9px"></div><div class="handle" data-dir="ne" style="right:-9px;top:-9px"></div><div class="handle" data-dir="sw" style="left:-9px;bottom:-9px"></div><div class="handle" data-dir="se" style="right:-9px;bottom:-9px"></div><div class="handle edge" data-dir="n" style="left:50%;top:-7px;transform:translateX(-50%)"></div><div class="handle edge" data-dir="s" style="left:50%;bottom:-7px;transform:translateX(-50%)"></div><div class="handle edge v" data-dir="w" style="left:-7px;top:50%;transform:translateY(-50%)"></div><div class="handle edge v" data-dir="e" style="right:-7px;top:50%;transform:translateY(-50%)"></div></div>
    <div id="layerBox"></div>
    <div id="zoomBar"><button id="btnZoomIn" aria-label="放大">＋</button><div id="zoomLabel">100%</div><button id="btnZoomOut" aria-label="縮小">－</button><button id="btnZoomFit" aria-label="適中" style="font-size:11px">適合</button></div>
    <div class="empty-hint" id="emptyHint">
      <div class="big"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg></div>
      <p>點下方「載入照片」開始<br><span style="color:#666;font-size:12px">支援多張一次選取，個別拖曳／縮放</span></p>
      <button id="btnPickEmpty">載入照片</button>
    </div>
  </div>
</div>

<div id="subBar"></div>
<div id="persistScale" style="display:none;background:#1e1e1e;border-top:1px solid #2a2a2a;padding:8px 10px;align-items:center;gap:8px"><button id="psZoomOut" class="btn-sm" aria-label="縮小" style="padding:4px 14px;font-size:17px;line-height:1">－</button><span style="font-size:12px;color:#aaa;white-space:nowrap">縮放</span><input type="range" id="persistScaleSlider" min="30" max="300" value="100" style="flex:1"><span id="persistScaleVal" style="font-size:12px;color:#0ea5e9;min-width:38px">100%</span><button id="psZoomIn" class="btn-sm" aria-label="放大" style="padding:4px 12px;font-size:17px;line-height:1">＋</button><button id="psZoomFit" class="btn-sm" style="font-size:11px;padding:4px 9px">適合</button></div>

<div id="toolBar">
  <button class="tool-btn" data-tool="load"><span class="tool-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg></span><span class="tool-label">載入照片</span></button>
  <button class="tool-btn" data-tool="crop"><span class="tool-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3v6H3"/><path d="M18 3v6h3"/><path d="M6 21v-6H3"/><path d="M18 21v-6h3"/><rect x="8" y="8" width="8" height="8"/></svg></span><span class="tool-label">裁切</span></button>
  <button class="tool-btn" data-tool="rotate"><span class="tool-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v7h-7"/></svg></span><span class="tool-label">旋轉翻轉</span></button>
  <button class="tool-btn" data-tool="text"><span class="tool-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16"/><path d="M12 7v10"/><path d="M8 17h8"/></svg></span><span class="tool-label">文字</span></button>
  <button class="tool-btn" data-tool="brush"><span class="tool-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7a2.5 2.5 0 0 0-3.5-3.5L9 15l-4 1 1-4z"/><path d="M13.5 6.5l3 3"/></svg></span><span class="tool-label">塗鴉</span></button>
  <button class="tool-btn" data-tool="mosaic"><span class="tool-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></span><span class="tool-label">馬賽克</span></button>
  <button class="tool-btn" data-tool="layout"><span class="tool-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></span><span class="tool-label">多圖排列</span></button>
  <button class="tool-btn" data-tool="export"><span class="tool-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 3v13"/><path d="M7 11l5 5 5-5"/><path d="M3 17v3a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-3"/></svg></span><span class="tool-label">輸出</span><span class="tool-dot"></span></button>
</div>

<input type="file" id="fileInput" accept="image/*" multiple style="display:none">

<!-- Layout modal -->
<div class="modal-mask" id="layoutModal">
  <div class="modal">
    <h3>多張照片排列</h3>
    <p>偵測到 <span id="layoutCount">0</span> 張照片，請選擇排列方式：</p>
    <div style="display:flex;gap:8px;margin:8px 0">
      <button class="btn-primary" id="btnFreeMode" style="flex:1">自由排列</button>
      <button class="btn-primary" id="btnGridMode" style="flex:1;background:#334155">網格拼貼</button>
    </div>
    <div id="gridTemplates" style="display:none">
      <p style="margin-top:10px">選擇網格範本：</p>
      <div class="grid-pick" id="gridPick"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-sm" id="btnLayoutCancel">取消</button>
      <button class="btn-primary" id="btnLayoutConfirm">確定建立</button>
    </div>
  </div>
</div>

<!-- Export modal -->
<div class="modal-mask" id="exportModal">
  <div class="modal">
    <h3>輸出設定</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">
      <label style="flex:1;min-width:120px">格式
        <select id="expFormat" style="width:100%;margin-top:4px;border:1px solid #333;background:#111;color:#e8e8e8;border-radius:8px;padding:8px">
          <option value="image/jpeg">JPG</option>
          <option value="image/png">PNG</option>
          <option value="image/webp">WebP</option>
        </select>
      </label>
      <label style="flex:1;min-width:120px">品質 <span id="qVal" class="range-val">92%</span>
        <input type="range" id="expQuality" min="10" max="100" value="92" style="width:100%">
      </label>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">
      <label style="flex:1">尺寸縮放 <span id="sVal" class="range-val">100%</span>
        <input type="range" id="expScale" min="10" max="200" value="100" style="width:100%">
      </label>
    </div>
    <div style="background:#111;border-radius:8px;padding:8px 10px;font-size:12px;color:#aaa" id="expInfo">—</div>
    <div class="modal-actions">
      <button class="btn-sm" id="btnExpCancel">取消</button>
      <button class="btn-primary" id="btnDoDownload">下載儲存</button>
      <button class="btn-sm" id="btnDoShare" style="display:none">分享</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(()=>{ 
const $ = s=>document.querySelector(s);
const main = $('#mainCanvas'), ocan = $('#overlayCanvas');
const ctx = main.getContext('2d');
const octx = ocan.getContext('2d');
const wrap = $('#canvasWrap'), stage = $('#stage'), subBar = $('#subBar'), emptyHint = $('#emptyHint');
const fileInput = $('#fileInput');
let hasImage=false, history=[], histIdx=-1, currentTool=null;
let pendingImages=[]; // Image elements for multi
let originalImgs=[], originalMode=null, originalTpl=null; // 最初載入狀態（重置用）
let selectedLayout='grid', selectedTemplate=null;
let brush = {color:'#ff3b30', size:8, drawing:false, pts:[]};
let mosaic = {size:16, drawing:false, pts:[]};
let textState = {text:'', font:'Noto Sans TC', size:48, color:'#ffffff', stroke:'#000000', strokeW:4, x:0, y:0, dragging:false, placed:false};
let textLayers=[]; // 已合併的文字，跨照片置頂
let cropState = {active:false, x:40,y:40,w:0,h:0, drag:null, ratio:0};
let layers=[], selectedLayer=-1, layerDrag=null, lastPinchDist=0;
let scaleToFit = 1;

// Toast
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}

// Prevent double-tap zoom + context menu
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{
  const now=Date.now();
  if(now-lastTouchEnd<=300) e.preventDefault();
  lastTouchEnd=now;
},{passive:false});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());

// History（含圖層快照）
function pushHistory(){
  try{
    // 若有圖層，先合成當前視圖
    if(layers.length) renderLayers();
    const url = main.toDataURL('image/png');
    const snap = layers.length ? JSON.stringify(layers.map(l=>({x:l.x,y:l.y,w:l.w,h:l.h,rot:l.rot,src:l.img.src}))) : null;
    history = history.slice(0, histIdx+1);
    history.push({url, snap, w:main.width, h:main.height});
    histIdx = history.length-1;
    if(history.length>30){history.shift();histIdx--;}
    updateUndo();
  }catch{}
}
function updateUndo(){
  $('#btnUndo').disabled = histIdx<=0;
  $('#btnRedo').disabled = histIdx>=history.length-1;
}
function restoreHistory(idx){
  if(idx<0||idx>=history.length) return;
  histIdx=idx;
  const entry = history[idx];
  const url = typeof entry==='string'? entry : entry.url;
  const snap = typeof entry==='object'? entry.snap : null;
  const img=new Image();
  img.onload=()=>{
    main.width=img.width; main.height=img.height;
    ocan.width=img.width; ocan.height=img.height;
    fitCanvas();
    ctx.clearRect(0,0,main.width,main.height);
    ctx.drawImage(img,0,0);
    // 嘗試還原圖層位置
    if(snap && layers.length){
      try{
        const arr=JSON.parse(snap);
        arr.forEach((s,i)=>{ if(layers[i]){ layers[i].x=s.x; layers[i].y=s.y; layers[i].w=s.w; layers[i].h=s.h; layers[i].rot=s.rot; }});
        renderLayers(); updateLayerBox();
      }catch{}
    }
    updateUndo(); updateSizeLabel(); renderTextOverlay(); if(layers.length) updateLayerBox();
  };
  img.src=url;
}
$('#btnUndo').onclick=()=>{ if(histIdx>0) restoreHistory(histIdx-1)};
$('#btnRedo').onclick=()=>{ if(histIdx<history.length-1) restoreHistory(histIdx+1)};
$('#btnReset').onclick=()=>{
  if(!hasImage || !originalImgs.length) return;
  if(confirm('確定重置回最初載入的狀態？')){
    // 用最初載入的原始照片完整重建，確保多圖仍為獨立圖層
    textLayers=[]; octx.clearRect(0,0,ocan.width,ocan.height);
    currentTool=null; renderSubBar(); updateToolActive(); hideCrop();
    selectedLayer=-1; hideLayerBox();
    history=[]; histIdx=-1; updateUndo();
    if(originalImgs.length>1){
      initLayersFromImages(originalImgs, originalMode||'free', originalTpl);
    } else {
      loadSingleImage(originalImgs[0]);
    }
    toast('已重置回最初狀態');
  }
};

function updateSizeLabel(){
  $('#sizeLabel').textContent = hasImage? `${main.width} × ${main.height}` : '';
}
function fitCanvas(){
  if(!hasImage) return;
  requestAnimationFrame(()=>{
    const availW = stage.clientWidth - 16;
    const availH = stage.clientHeight - 16;
    const r0 = Math.min(availW / main.width, availH / main.height, 1);
    const w = Math.round(main.width * r0);
    const h = Math.round(main.height * r0);
    wrap.style.width = w+'px';
    wrap.style.height = h+'px';
    ocan.style.width = '100%'; ocan.style.height='100%';
    if(cropState.active) updateCropBox();
    if(selectedLayer>=0) updateLayerBox();
  });
}
window.addEventListener('resize', fitCanvas);
// 滾輪/雙指縮放：調整單張照片（選中圖層）
function ensureSingleLayer(){
  if(layers.length===0 && hasImage){
    const img=new Image(); img.src=main.toDataURL();
    layers=[{img, x:0, y:0, w:main.width, h:main.height, rot:0, baseW:main.width, baseH:main.height}];
    selectedLayer=0;
  }
}
function scaleSelected(factor, cx, cy){
  if(!hasImage) return;
  if(layers.length===0) ensureSingleLayer();
  if(selectedLayer<0) selectedLayer=0;
  const l=layers[selectedLayer];
  if(!l) return;
  const oldW=l.w, oldH=l.h;
  let nw=Math.max(30, Math.min(main.width*2.5, oldW*factor));
  let nh=Math.max(30, Math.min(main.height*2.5, oldH*factor));
  // 保持比例（以寬為基準）
  const ratio=oldW/oldH;
  if(Math.abs(nw/nh - ratio) > 0.01) nh=nw/ratio;
  // 以中心或指定點為錨點縮放
  if(cx!==undefined && cy!==undefined){
    const px=(cx - l.x)/oldW, py=(cy - l.y)/oldH;
    l.x = cx - px*nw;
    l.y = cy - py*nh;
  } else {
    l.x = l.x + (oldW - nw)/2;
    l.y = l.y + (oldH - nh)/2;
  }
  l.w=nw; l.h=nh;
  if(l.cell){
    const c=l.cell;
    // 允許放大超過格子（超出部分裁切），位置夾緊保持可見
    if(l.w <= c.w){
      l.x = Math.max(c.x+1, Math.min(c.x+c.w - l.w -1, l.x));
    } else {
      l.x = Math.max(c.x + c.w - l.w, Math.min(c.x, l.x));
    }
    if(l.h <= c.h){
      l.y = Math.max(c.y+1, Math.min(c.y+c.h - l.h -1, l.y));
    } else {
      l.y = Math.max(c.y + c.h - l.h, Math.min(c.y, l.y));
    }
  }
  renderLayers(); updateLayerBox(); updatePersistScale();
}
let lastDist=0, lastMid=null;
stage.addEventListener('touchstart', e=>{
  if(e.touches.length===2 && hasImage){
    if(layers.length===0) ensureSingleLayer();
    layerDrag=null;
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    lastDist=Math.hypot(dx,dy);
    lastMid={x:(e.touches[0].clientX+e.touches[1].clientX)/2, y:(e.touches[0].clientY+e.touches[1].clientY)/2};
  }
},{passive:false});
stage.addEventListener('touchmove', e=>{
  if(e.touches.length===2 && layers.length>0){
    e.preventDefault();
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const d=Math.hypot(dx,dy);
    if(lastDist>0){
      const s=d/lastDist;
      const mid={x:(e.touches[0].clientX+e.touches[1].clientX)/2, y:(e.touches[0].clientY+e.touches[1].clientY)/2};
      const p=canvasPoint({clientX:mid.x, clientY:mid.y});
      scaleSelected(s, p.x, p.y);
    }
    lastDist=d;
  }
},{passive:false});
stage.addEventListener('touchend', e=>{ if(e.touches.length<2){ lastDist=0; if(layers.length) pushHistory(); }});
stage.addEventListener('wheel', e=>{
  if(!hasImage) return;
  // 滾輪直接縮放選中單張
  e.preventDefault();
  const rect=main.getBoundingClientRect();
  const p=canvasPoint({clientX:e.clientX, clientY:e.clientY});
  const inside = p.x>=0 && p.x<=main.width && p.y>=0 && p.y<=main.height;
  const factor=e.deltaY<0?1.08:0.92;
  if(layers.length>0 || inside){
    const cx=inside? p.x : undefined;
    const cy=inside? p.y : undefined;
    scaleSelected(factor, cx, cy);
  }
},{passive:false});
let wheelEndTimer=null;
stage.addEventListener('wheel', e=>{
  clearTimeout(wheelEndTimer);

// Helpers
function fileToImage(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>res(img);
      img.onerror=rej;
      img.src=r.result;
    };
    r.onerror=rej;
    r.readAsDataURL(file);
  });
}
async function handleFiles(files){
  if(!files||!files.length) return;
  const imgs=[];
  for(let f of files){
    if(!f.type.startsWith('image/')) continue;
    try{ imgs.push(await fileToImage(f)); }catch{}
  }
  if(!imgs.length){ toast('未讀到圖片'); return; }
  if(imgs.length>1){
    pendingImages=imgs;
    openLayoutModal();
  } else {
    originalImgs=[imgs[0]]; originalMode=null; originalTpl=null;
    layers=[]; selectedLayer=-1;
    loadSingleImage(imgs[0]);
  }
}
function loadSingleImage(img){
  hasImage=true;
  emptyHint.style.display='none';
  layers=[]; selectedLayer=-1; hideLayerBox();
  let w=img.width, h=img.height;
  const max=2600;
  if(w>max||h>max){
    const r=Math.min(max/w, max/h);
    w=Math.round(w*r); h=Math.round(h*r);
  }
  main.width=w; main.height=h;
  ocan.width=w; ocan.height=h;
  ctx.clearRect(0,0,w,h);
  ctx.drawImage(img,0,0,w,h);
  fitCanvas(); updateSizeLabel(); pushHistory();
  updatePersistScale();
  toast('已載入');
}
// ===== 多圖獨立圖層系統 =====
function initLayersFromImages(imgs, mode, tplId){
  hasImage=true; emptyHint.style.display='none';
  layers=[]; selectedLayer=-1;
  if(mode==='free'){
    const outW=1200, outH=1200;
    main.width=outW; main.height=outH; ocan.width=outW; ocan.height=outH;
    const n=imgs.length;
    imgs.forEach((img,i)=>{
      const scale=Math.min(520/img.width, 520/img.height, 0.9);
      const w=img.width*scale, h=img.height*scale;
      const cols=Math.ceil(Math.sqrt(n));
      const col=i%cols, row=Math.floor(i/cols);
      const x= 40 + col*(560) + (520-w)/2;
      const y= 40 + row*(560) + (520-h)/2;
      layers.push({img, x, y, w, h, rot:0, baseW:w, baseH:h});
    });
  } else {
    const map={ '1x2':[2,1], '2x1':[1,2], '2x2':[2,2], '1x3':[3,1], '3x1':[1,3], '1x4':[4,1]};
    const [cols,rows]=map[tplId]||[2,1];
    const outW=1200, outH= Math.round(1200 * rows/cols * 0.85);
    main.width=outW; main.height=outH; ocan.width=outW; ocan.height=outH;
    const gap=4;
    const cellW=(outW - gap*(cols+1))/cols;
    const cellH=(outH - gap*(rows+1))/rows;
    let idx=0;
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        if(idx>=imgs.length) break;
        const img=imgs[idx];
        const cellX=gap + c*(cellW+gap), cellY=gap + r*(cellH+gap);
        // 不預先裁切：等比置中留白（contain），讓操作者自行拖曳/縮放
        const ir=img.width/img.height, cr=cellW/cellH;
        let w,h,x,y;
        if(ir > cr){ w=cellW; h=w/ir; x=cellX; y=cellY+(cellH-h)/2; }
        else { h=cellH; w=h*ir; x=cellX+(cellW-w)/2; y=cellY; }
        // 稍微內縮留邊，避免貼框
        const pad=2; x+=pad; y+=pad; w-=pad*2; h-=pad*2;
        layers.push({img, x, y, w, h, rot:0, baseW:w, baseH:h, cell:{x:cellX, y:cellY, w:cellW, h:cellH}});
        idx++;
      }
    }
  }
  selectedLayer = layers.length?0:-1;
  renderLayers(); fitCanvas(); updateSizeLabel(); pushHistory();
  updateLayerBox(); updatePersistScale(); toast('已建立獨立圖層，點選照片可個別拖曳/縮放');
}
function renderLayers(){
  const hasPhotos=layers.length>0;
  const hasText=textLayers.length>0;
  if(!hasPhotos && !hasText) return;
  if(hasPhotos){
    ctx.clearRect(0,0,main.width,main.height);
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,main.width,main.height);
    if(layers[0] && layers[0].cell){
      ctx.save();
      ctx.strokeStyle='#ddd'; ctx.lineWidth=1;
      const seen=new Set();
      layers.forEach(l=>{ const k=l.cell.x+','+l.cell.y; if(!seen.has(k)){ seen.add(k); ctx.strokeRect(l.cell.x+0.5,l.cell.y+0.5,l.cell.w-1,l.cell.h-1); }});
      ctx.strokeRect(0.5,0.5,main.width-1,main.height-1);
      ctx.restore();
    }
    layers.forEach(l=>{
      ctx.save();
      if(l.cell){ ctx.beginPath(); ctx.rect(l.cell.x+1,l.cell.y+1,l.cell.w-2,l.cell.h-2); ctx.clip(); }
      ctx.translate(l.x + l.w/2, l.y + l.h/2);
      ctx.rotate(l.rot*Math.PI/180);
      ctx.drawImage(l.img, -l.w/2, -l.h/2, l.w, l.h);
      ctx.strokeStyle='rgba(0,0,0,.06)'; ctx.lineWidth=1; ctx.strokeRect(-l.w/2,-l.h/2,l.w,l.h);
      ctx.restore();
    });
  } else if(hasText){
    // 單張模式有文字但無圖層：不清除底圖，直接疊加文字（避免白底覆蓋）
    // 需先還原底圖為當前歷史再疊加
  }
  // 跨照片置頂文字（多圖或單張皆置頂）
  textLayers.forEach(t=>{
    ctx.save();
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font=`700 ${t.size}px "${t.font}", sans-serif`;
    ctx.lineJoin='round';
    if(t.strokeW>0){ ctx.strokeStyle=t.stroke; ctx.lineWidth=t.strokeW*2; ctx.strokeText(t.text, t.x, t.y); }
    ctx.fillStyle=t.color; ctx.fillText(t.text, t.x, t.y);
    ctx.restore();
  });
}
function hitLayer(px,py){
  for(let i=layers.length-1;i>=0;i--){
    const l=layers[i];
    let tx=px, ty=py;
    if(l.rot!==0){
      const cx=l.x+l.w/2, cy=l.y+l.h/2;
      const dx=px-cx, dy=py-cy;
      const rad=-l.rot*Math.PI/180;
      tx=dx*Math.cos(rad)-dy*Math.sin(rad)+cx;
      ty=dx*Math.sin(rad)+dy*Math.cos(rad)+cy;
    }
    // 若有格子，點擊格內即選中該張（方便拖動留白區域）
    if(l.cell){
      if(tx>=l.cell.x && tx<=l.cell.x+l.cell.w && ty>=l.cell.y && ty<=l.cell.y+l.cell.h) return i;
    }
    if(tx>=l.x && tx<=l.x+l.w && ty>=l.y && ty<=l.y+l.h) return i;
  }
  return -1;
}
function updateLayerBox(){
  const box=$('#layerBox');
  if(selectedLayer<0 || !layers.length || currentTool==='crop'){ box.style.display='none'; return; }
  const l=layers[selectedLayer];
  const rect=main.getBoundingClientRect();
  const sx=rect.width/main.width, sy=rect.height/main.height;
  box.style.display='block';
  box.style.left=(l.x*sx)+'px'; box.style.top=(l.y*sy)+'px';
  box.style.width=(l.w*sx)+'px'; box.style.height=(l.h*sy)+'px';
  box.style.transform=`rotate(${l.rot}deg)`; box.style.transformOrigin='center center';
}
function hideLayerBox(){ $('#layerBox').style.display='none'; }
function updatePersistScale(){
  const bar=$('#persistScale'), slider=$('#persistScaleSlider'), val=$('#persistScaleVal');
  if(!bar) return;
  if(layers.length===0 && !hasImage){ bar.style.display='none'; return; }
  // 單張或多張：有選中才顯示，否則用第一張
  let idx=selectedLayer; if(idx<0 && layers.length) idx=0;
  if(layers.length===0 && hasImage){
    // 單張未轉圖層時也顯示，預設 100%
    bar.style.display='flex';
    if(slider && !slider._boundSingle){
      slider._boundSingle=true;
      slider.oninput=()=>{
        const v=parseInt(slider.value); val.textContent=v+'%';
        ensureSingleLayer();
        const l=layers[selectedLayer];
        let nw=l.baseW*v/100, nh=l.baseH*v/100;
        const cx=main.width/2, cy=main.height/2;
        l.w=nw; l.h=nh; l.x=cx-nw/2; l.y=cy-nh/2;
        renderLayers(); updateLayerBox();
      };
      slider.onchange=()=> pushHistory();
    }
    return;
  }
  if(idx<0 || !layers[idx]){ bar.style.display='none'; return; }
  bar.style.display='flex';
  const l=layers[idx];
  const curScale=l.baseW? Math.round(l.w/l.baseW*100) : 100;
  if(slider){ slider.value=curScale; val.textContent=curScale+'%'; }
  if(slider && !slider._bound){
    slider._bound=true;
    slider.oninput=()=>{
      const v=parseInt(slider.value); val.textContent=v+'%';
      const ll=layers[selectedLayer>=0?selectedLayer:0]; if(!ll) return;
      let nw=ll.baseW*v/100, nh=ll.baseH*v/100;
      // 置中縮放，避免卡上框向下延伸變形
      if(ll.cell){
        const c=ll.cell;
        ll.w=nw; ll.h=nh;
        ll.x=c.x + (c.w - nw)/2;
        ll.y=c.y + (c.h - nh)/2;
      } else {
        const cx=ll.x+ll.w/2, cy=ll.y+ll.h/2;
        ll.w=nw; ll.h=nh;
        ll.x=cx - nw/2; ll.y=cy - nh/2;
      }
      renderLayers(); updateLayerBox();
    };
    slider.onchange=()=> pushHistory();
  }
}

$('#psZoomFit').onclick=()=>{

  const l=layers[selectedLayer>=0?selectedLayer:0]; if(!l) return;
  const cx=l.x+l.w/2, cy=l.y+l.h/2;
  if(l.cell){
    const c=l.cell, r=l.baseW/l.baseH, cr2=c.w/c.h;

  } else {
    l.w=l.baseW; l.h=l.baseH; l.x=cx-l.w/2; l.y=cy-l.h/2;
  }
  renderLayers(); updateLayerBox(); updatePersistScale(); pushHistory();
};

// Text overlay render
function renderTextOverlay(){
  if(currentTool!=='text'){ octx.clearRect(0,0,ocan.width,ocan.height); return; }
  octx.clearRect(0,0,ocan.width,ocan.height);
  const s=textState;
  const isPlaceholder=!s.text;
  const displayText=isPlaceholder?'請輸入文字':s.text;
  const displayColor=isPlaceholder?'rgba(180,180,180,0.9)':s.color;
  const displayStroke=isPlaceholder?null:s.stroke;
  // 若尚未放置，預設置中
  if(!s.placed){ s.x=main.width/2; s.y=main.height/2; }
  octx.save();
  octx.textAlign='center'; octx.textBaseline='middle';
  octx.font=`700 ${s.size}px "${s.font}", sans-serif`;
  octx.lineJoin='round';
  if(!isPlaceholder) octx.shadowColor='rgba(0,0,0,.4)', octx.shadowBlur=6;
  if(s.strokeW>0 && displayStroke){ octx.strokeStyle=displayStroke; octx.lineWidth=s.strokeW*2; octx.strokeText(displayText, s.x, s.y); }
  octx.fillStyle=displayColor; octx.fillText(displayText, s.x, s.y);
  octx.restore();
  // 虛線框提示大小與位置
  octx.save();
  octx.strokeStyle=isPlaceholder?'#aaa':'#0ea5e9'; octx.setLineDash(isPlaceholder?[4,6]:[6,4]); octx.lineWidth=1.5;
  const m=octx.measureText(displayText);
  const tw=m.width, th=s.size*1.1;
  octx.strokeRect(s.x-tw/2-8, s.y-th/2-6, tw+16, th+12);
  octx.restore();
}
function commitText(){
  if(!textState.text){ toast('請輸入文字'); return; }
  // 統一轉為圖層+文字置頂，支援長按刪除與跨照片
  if(layers.length===0 && hasImage) ensureSingleLayer();
  pushHistory();
  textLayers.push({text:textState.text, x:textState.x, y:textState.y, font:textState.font, size:textState.size, color:textState.color, stroke:textState.stroke, strokeW:textState.strokeW});
  octx.clearRect(0,0,ocan.width,ocan.height);
  if(layers.length) renderLayers();
  else {
    ctx.save();
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font=`700 ${textState.size}px "${textState.font}", sans-serif`;
    ctx.lineJoin='round';
    if(textState.strokeW>0){ ctx.strokeStyle=textState.stroke; ctx.lineWidth=textState.strokeW*2; ctx.strokeText(textState.text, textState.x, textState.y); }
    ctx.fillStyle=textState.color; ctx.fillText(textState.text, textState.x, textState.y);
    ctx.restore();
  }
  pushHistory();
  toast(layers.length?'文字已置頂顯示（長按可刪除）':'文字已合併');
  return;
}

let longPressTimer=null, longPressTarget=-1;
function hitText(px,py){
  for(let i=textLayers.length-1;i>=0;i--){
    const t=textLayers[i];
    const ctx2=document.createElement('canvas').getContext('2d');
    ctx2.font=`700 ${t.size}px "${t.font}", sans-serif`;
    const m=ctx2.measureText(t.text);
    const tw=m.width, th=t.size*1.1;
    if(px>=t.x-tw/2-8 && px<=t.x+tw/2+8 && py>=t.y-th/2-6 && py<=t.y+th/2+6) return i;
  }
  return -1;
}
// Pointer handling for brush/mosaic/text drag/crop/layers
let activePointer=null;
function canvasPoint(e){
  const rect = main.getBoundingClientRect();
  const scaleX = main.width / rect.width;
  const scaleY = main.height / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;
  return {x,y};
}
ocan.style.pointerEvents='none';
function enableOverlayEvents(on){ ocan.style.pointerEvents = on ? 'auto' : 'none'; }

main.addEventListener('pointerdown', onPointerDown);
main.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', onPointerUp);
ocan.addEventListener('pointerdown', onPointerDown);
ocan.addEventListener('pointermove', onPointerMove);
// crop handles direct drag
wrap.querySelectorAll('#cropBox .handle').forEach(h=>{
  h.addEventListener('pointerdown', e=>{
    if(!cropState.active) return;
    e.stopPropagation(); e.preventDefault();

    const p=canvasPoint(e);
    cropState.drag={type:dir, sx:p.x, sy:p.y, ox:cropState.x, oy:cropState.y, ow:cropState.w, oh:cropState.h};
    enableOverlayEvents(true);
    try{ h.setPointerCapture(e.pointerId);}catch{}
  });
});
// layerBox 已改為純反白燈光，無手把，縮放改用滾輪/雙指

function onPointerDown(e){
  if(!hasImage) return;
  // 多圖層拖曳與文字長按刪除
  if(layers.length>0 && currentTool!=='brush' && currentTool!=='mosaic' && currentTool!=='crop'){
    const p=canvasPoint(e);
    // 文字長按刪除優先（已合併的跨照片文字）
    const th=hitText(p.x,p.y);
    if(th!==-1){
      longPressTarget=th;
      clearTimeout(longPressTimer);
      longPressTimer=setTimeout(()=>{
        if(longPressTarget===th){
          if(confirm('長按偵測：刪除此文字？')){
            textLayers.splice(th,1); renderLayers(); pushHistory(); toast('已刪除文字');
          }
          longPressTarget=-1;
        }
      }, 650);
      // 同時允許拖動該文字（若不長按則拖動）
      // 暫不return，讓後續可拖動照片，長按才刪除
    }
    // 若正在文字拖曳，優先文字
    if(currentTool==='text'){
      octx.font=`700 ${textState.size}px "${textState.font}", sans-serif`;
      const m=octx.measureText(textState.text);
      const tw=m.width, th=textState.size*1.1;
      const bx=textState.x-tw/2-10, by=textState.y-th/2-8, bw=tw+20, bh=th+16;
      if(p.x>=bx && p.x<=bx+bw && p.y>=by && p.y<=by+bh){
        textState.dragging=true;
        activePointer={dx:p.x-textState.x, dy:p.y-textState.y};
        enableOverlayEvents(true); return;
      }
    }
    const hit=hitLayer(p.x,p.y);
    if(hit!==-1){
      selectedLayer=hit; updateLayerBox(); updatePersistScale(); if(currentTool==='layout') renderSubBar();
      const l=layers[hit];
      layerDrag={type:'move', sx:p.x, sy:p.y, ox:l.x, oy:l.y};
      e.preventDefault(); return;
    } else {
      // 點空白處不取消選取，保持
    }
  } else if(textLayers.length && currentTool!=='brush' && currentTool!=='mosaic' && currentTool!=='crop'){
    const p=canvasPoint(e);
    const th=hitText(p.x,p.y);
    if(th!==-1){
      longPressTarget=th;
      clearTimeout(longPressTimer);
      longPressTimer=setTimeout(()=>{
        if(longPressTarget===th){
          if(confirm('長按偵測：刪除此文字？')){
            textLayers.splice(th,1);
            // 單張模式需重繪底圖
            if(layers.length) renderLayers(); else { ctx.clearRect(0,0,main.width,main.height); ctx.fillStyle='#fff'; ctx.fillRect(0,0,main.width,main.height); /* 需還原底圖？簡化：重新繪製 */ }
            pushHistory(); toast('已刪除文字');
          }
          longPressTarget=-1;
        }
      }, 650);
      e.preventDefault(); return;
    }
  }
  if(currentTool==='brush'){
    enableOverlayEvents(true);
    const p=canvasPoint(e);
    // 若有圖層，先將圖層合成到主畫布（扁平化）再塗鴉
    if(layers.length>0){ renderLayers(); layers=[]; selectedLayer=-1; hideLayerBox(); }
    brush.drawing=true; brush.pts=[p];
    pushHistory();
    e.preventDefault(); main.setPointerCapture?.(e.pointerId);
  } else if(currentTool==='mosaic'){
    enableOverlayEvents(true);
    const p=canvasPoint(e);
    if(layers.length>0){ renderLayers(); layers=[]; selectedLayer=-1; hideLayerBox(); }
    mosaic.drawing=true; mosaic.pts=[p];
    pushHistory();
    e.preventDefault();
  } else if(currentTool==='text'){
    const p=canvasPoint(e);
    if(layers.length>0){ /* 文字可直接在圖層上，暫不扁平 */ }
    octx.font=`700 ${textState.size}px "${textState.font}", sans-serif`;
    const m=octx.measureText(textState.text);
    const tw=m.width, th=textState.size*1.1;
    const bx=textState.x-tw/2-10, by=textState.y-th/2-8, bw=tw+20, bh=th+16;
    if(p.x>=bx && p.x<=bx+bw && p.y>=by && p.y<=by+bh){
      textState.dragging=true;
      activePointer={dx:p.x-textState.x, dy:p.y-textState.y};
      enableOverlayEvents(true);
    }
  } else if(currentTool==='crop'){
    const p=canvasPoint(e);
    const r=cropState;
    // 手把優先透過 DOM handle 處理（已在上方綁定），此處處理框內移動與框選新建
    if(p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h){
      r.drag={type:'move', sx:p.x, sy:p.y, ox:r.x, oy:r.y};
      enableOverlayEvents(true);
    } else {
      // 框選：從點擊處拉出新框
      r.drag={type:'create', sx:p.x, sy:p.y, ox:p.x, oy:p.y, ow:0, oh:0};
      r.x=p.x; r.y=p.y; r.w=0; r.h=0;
      updateCropBox();
      enableOverlayEvents(true);
      $('#cropBox').style.display='block';
    }
  }
}
function onPointerMove(e){
  if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer=null; longPressTarget=-1; }
  if(!hasImage) return;
  const p=canvasPoint(e);
  if(layerDrag){
    const l=layers[selectedLayer];
    if(!l) return;
    if(layerDrag.type==='move'){
      l.x = layerDrag.ox + (p.x-layerDrag.sx);
      l.y = layerDrag.oy + (p.y-layerDrag.sy);
      if(l.cell){
        const c=l.cell;
        // 小於格子→完全在格內；大於格子→允許超出，只要蓋住格子即可
        if(l.w <= c.w){
          l.x = Math.max(c.x+1, Math.min(c.x+c.w - l.w -1, l.x));
        } else {
          l.x = Math.max(c.x + c.w - l.w, Math.min(c.x, l.x));
        }
        if(l.h <= c.h){
          l.y = Math.max(c.y+1, Math.min(c.y+c.h - l.h -1, l.y));
        } else {
          l.y = Math.max(c.y + c.h - l.h, Math.min(c.y, l.y));
        }
      } else {
        l.x = Math.max(-l.w*0.6, Math.min(main.width-l.w*0.4, l.x));
        l.y = Math.max(-l.h*0.6, Math.min(main.height-l.h*0.4, l.y));
      }
    } else {
      // 縮放（含邊框拉伸）
      let dx=p.x-layerDrag.sx, dy=p.y-layerDrag.sy;
      let nx=layerDrag.ox, ny=layerDrag.oy, nw=layerDrag.ow, nh=layerDrag.oh;
      if(layerDrag.type==='se'){ nw=layerDrag.ow+dx; nh=layerDrag.oh+dy; }
      else if(layerDrag.type==='nw'){ nx=layerDrag.ox+dx; ny=layerDrag.oy+dy; nw=layerDrag.ow-dx; nh=layerDrag.oh-dy; }
      else if(layerDrag.type==='ne'){ ny=layerDrag.oy+dy; nw=layerDrag.ow+dx; nh=layerDrag.oh-dy; nx=layerDrag.ox; }
      else if(layerDrag.type==='sw'){ nx=layerDrag.ox+dx; nw=layerDrag.ow-dx; nh=layerDrag.oh+dy; ny=layerDrag.oy; }
      else if(layerDrag.type==='e'){ nw=layerDrag.ow+dx; }
      else if(layerDrag.type==='w'){ nx=layerDrag.ox+dx; nw=layerDrag.ow-dx; }
      else if(layerDrag.type==='s'){ nh=layerDrag.oh+dy; }
      else if(layerDrag.type==='n'){ ny=layerDrag.oy+dy; nh=layerDrag.oh-dy; }
      const min=30;
      if(nw<min){ nw=min; if(layerDrag.type==='nw'||layerDrag.type==='sw'||layerDrag.type==='w') nx=layerDrag.ox+layerDrag.ow-min; }
      if(nh<min){ nh=min; if(layerDrag.type==='nw'||layerDrag.type==='ne'||layerDrag.type==='n') ny=layerDrag.oy+layerDrag.oh-min; }
      if(l.cell){
        const c=l.cell;
        // 尺寸不可超過格子
        if(nw > c.w-2) { nw=c.w-2; if(layerDrag.type==='nw'||layerDrag.type==='sw'||layerDrag.type==='w') nx=c.x+1; }
        if(nh > c.h-2) { nh=c.h-2; if(layerDrag.type==='nw'||layerDrag.type==='ne'||layerDrag.type==='n') ny=c.y+1; }
        // 位置夾緊在格內
        nx = Math.max(c.x+1, Math.min(c.x+c.w - nw -1, nx));
        ny = Math.max(c.y+1, Math.min(c.y+c.h - nh -1, ny));
      }
      l.x=nx; l.y=ny; l.w=nw; l.h=nh;
    }
    renderLayers(); updateLayerBox(); e.preventDefault(); return;
  }
  if(currentTool==='brush' && brush.drawing){
    brush.pts.push(p);
    ctx.strokeStyle=brush.color; ctx.lineWidth=brush.size; ctx.lineCap='round'; ctx.lineJoin='round';
    if(brush.pts.length>=2){
      const a=brush.pts[brush.pts.length-2], b=brush.pts[brush.pts.length-1];
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(p.x,p.y,brush.size/2,0,Math.PI*2); ctx.fillStyle=brush.color; ctx.fill();
    }
    e.preventDefault();
  } else if(currentTool==='mosaic' && mosaic.drawing){
    mosaic.pts.push(p);
    applyMosaicAt(p.x,p.y, mosaic.size);
    e.preventDefault();
  } else if(currentTool==='text' && textState.dragging){
    textState.x=p.x-activePointer.dx;
    textState.y=p.y-activePointer.dy;
    renderTextOverlay();
    if(layers.length) updateLayerBox();
    e.preventDefault();
  } else if(currentTool==='crop' && cropState.drag){
    const d=cropState.drag;
    if(d.type==='create'){
      const x1=d.sx, y1=d.sy, x2=p.x, y2=p.y;
      let nx=Math.min(x1,x2), ny=Math.min(y1,y2), nw=Math.abs(x2-x1), nh=Math.abs(y2-y1);
      if(layers.length && selectedLayer>=0){
        const l=layers[selectedLayer];
        nx=Math.max(l.x, Math.min(nx, l.x+l.w-1)); ny=Math.max(l.y, Math.min(ny, l.y+l.h-1));
        if(nx+nw>l.x+l.w) nw=l.x+l.w-nx; if(ny+nh>l.y+l.h) nh=l.y+l.h-ny;
      } else {
        nx=Math.max(0, Math.min(nx, main.width-1)); ny=Math.max(0, Math.min(ny, main.height-1));
        if(nx+nw>main.width) nw=main.width-nx; if(ny+nh>main.height) nh=main.height-ny;
      }
      cropState.x=nx; cropState.y=ny; cropState.w=nw; cropState.h=nh;
      updateCropBox();
    } else if(d.type==='move'){
      cropState.x = d.ox + (p.x-d.sx);
      cropState.y = d.oy + (p.y-d.sy);
      if(layers.length && selectedLayer>=0){
        const l=layers[selectedLayer];
        cropState.x=Math.max(l.x, Math.min(cropState.x, l.x+l.w - cropState.w));
        cropState.y=Math.max(l.y, Math.min(cropState.y, l.y+l.h - cropState.h));
      } else {
        cropState.x=Math.max(0,Math.min(main.width-cropState.w, cropState.x));
        cropState.y=Math.max(0,Math.min(main.height-cropState.h, cropState.y));
      }
      updateCropBox();
    } else {
      let nx=d.ox, ny=d.oy, nw=d.ow, nh=d.oh;
      const dx=p.x-d.sx, dy=p.y-d.sy;
      if(d.type==='se'){ nw=d.ow+dx; nh=d.oh+dy; }
      else if(d.type==='nw'){ nx=d.ox+dx; ny=d.oy+dy; nw=d.ow-dx; nh=d.oh-dy; }
      else if(d.type==='ne'){ ny=d.oy+dy; nw=d.ow+dx; nh=d.oh-dy; }
      else if(d.type==='sw'){ nx=d.ox+dx; nw=d.ow-dx; nh=d.oh+dy; }
      else if(d.type==='e'){ nw=d.ow+dx; }
      else if(d.type==='w'){ nx=d.ox+dx; nw=d.ow-dx; }
      else if(d.type==='s'){ nh=d.oh+dy; }
      else if(d.type==='n'){ ny=d.oy+dy; nh=d.oh-dy; }
      // 比例鎖定
      if(d.ratio){
        const ratio=d.ratio;
        if(d.type==='se'||d.type==='nw'){
          if(Math.abs(dx)>Math.abs(dy)) nh=nw/ratio; else nw=nh*ratio;
          if(d.type==='nw'){ nx=d.ox+d.ow-nw; ny=d.oy+d.oh-nh; }
        } else if(d.type==='ne'||d.type==='sw'){
          if(Math.abs(dx)>Math.abs(dy)) nh=nw/ratio; else nw=nh*ratio;
          if(d.type==='ne') ny=d.oy+d.oh-nh;
          if(d.type==='sw') nx=d.ox+d.ow-nw;
        } else if(d.type==='n'||d.type==='s'){
          nw=nh*ratio; nx=d.ox+(d.ow-nw)/2;
          if(d.type==='n') ny=d.oy+d.oh-nh;
        } else if(d.type==='e'||d.type==='w'){
          nh=nw/ratio; ny=d.oy+(d.oh-nh)/2;
          if(d.type==='w') nx=d.ox+d.ow-nw;
        }
      }
      // 最小尺寸與邊界
      const min=20;
      if(nw<min){ nw=min; if(d.type==='nw'||d.type==='sw') nx=d.ox+d.ow-min; if(d.ratio) { nh=nw/d.ratio; if(d.type==='nw'||d.type==='ne') ny=d.oy+d.oh-nh; } }
      if(nh<min){ nh=min; if(d.type==='nw'||d.type==='ne') ny=d.oy+d.oh-min; if(d.ratio) { nw=nh*d.ratio; if(d.type==='nw'||d.type==='sw') nx=d.ox+d.ow-nw; } }
      if(layers.length && selectedLayer>=0){
        const l=layers[selectedLayer];
        nx=Math.max(l.x, Math.min(nx, l.x+l.w - nw)); ny=Math.max(l.y, Math.min(ny, l.y+l.h - nh));
        if(nx+nw>l.x+l.w) nw=l.x+l.w-nx; if(ny+nh>l.y+l.h) nh=l.y+l.h-ny;
      } else {
        nx=Math.max(0, Math.min(nx, main.width-nw)); ny=Math.max(0, Math.min(ny, main.height-nh));
        if(nx+nw>main.width) nw=main.width-nx; if(ny+nh>main.height) nh=main.height-ny;
      }
      cropState.x=nx; cropState.y=ny; cropState.w=nw; cropState.h=nh;
      updateCropBox();
    }
  }
}
function onPointerUp(e){
  if(longPressTimer){ clearTimeout(longPressTimer); longPressTimer=null; }
  longPressTarget=-1;
  if(layerDrag){
    layerDrag=null;
    pushHistory();
    e.preventDefault();
  }
  if(brush.drawing){
    brush.drawing=false;
    history[histIdx]=main.toDataURL('image/png');
    history.push(main.toDataURL('image/png')); histIdx=history.length-1; updateUndo();
    enableOverlayEvents(false);
  }
  if(mosaic.drawing){
    mosaic.drawing=false;
    history.push(main.toDataURL('image/png')); histIdx=history.length-1; updateUndo();
    enableOverlayEvents(false);
  }
  if(textState.dragging){ textState.dragging=false; enableOverlayEvents(false); }
  if(cropState.drag){
    const was=cropState.drag; cropState.drag=null; enableOverlayEvents(false);
    // 框選後自動裁切（放開即裁）
    if(was && cropState.w>12 && cropState.h>12){
      // 延遲一點避免與點擊衝突
      setTimeout(()=>{ if(cropState.active) doCrop(); }, 80);
    }
  }
}

// Crop
function initCrop(){
  if(!hasImage) return;
  cropState.active=true; cropState.ratio=0;
  // 框選模式：進入時不顯示框，點擊拖曳後才出現
  cropState.w=0; cropState.h=0;
  $('#cropBox').style.display='none';
  if(layers.length && selectedLayer>=0){
    toast('在選中照片上拖曳框選，放開即裁切');
  } else if(layers.length){
    selectedLayer=0; updateLayerBox(); updatePersistScale();
    toast('已選第一張，請拖曳框選');
  } else {
    toast('拖曳框選裁切範圍');
  }
  enableOverlayEvents(false);
}
function hideCrop(){ $('#cropBox').style.display='none'; cropState.active=false; }
function updateCropBox(){
  const box=$('#cropBox');
  const rect=main.getBoundingClientRect();
  const sx=rect.width/main.width, sy=rect.height/main.height;
  box.style.left=(cropState.x*sx)+'px';
  box.style.top=(cropState.y*sy)+'px';
  box.style.width=(cropState.w*sx)+'px';
  box.style.height=(cropState.h*sy)+'px';
}
function doCrop(){
  const r=cropState;
  if(r.w<10||r.h<10){ toast('選取範圍太小'); return; }
  // 多圖：只裁切選中單張，保留格位
  if(layers.length && selectedLayer>=0){
    const l=layers[selectedLayer];
    const ix = Math.max(r.x, l.x), iy = Math.max(r.y, l.y);
    const ix2 = Math.min(r.x+r.w, l.x+l.w), iy2 = Math.min(r.y+r.h, l.y+l.h);
    const cw = ix2-ix, ch = iy2-iy;
    if(cw<10||ch<10){ toast('裁切範圍需在選中照片內'); return; }
    pushHistory();
    const sx=(ix - l.x)/l.w * l.img.width, sy=(iy - l.y)/l.h * l.img.height;
    const sw=cw/l.w * l.img.width, sh=ch/l.h * l.img.height;
    const tmp=document.createElement('canvas'); tmp.width=Math.round(sw); tmp.height=Math.round(sh);
    tmp.getContext('2d').drawImage(l.img, sx,sy,sw,sh, 0,0, tmp.width, tmp.height);
    const nimg=new Image();
    nimg.onload=()=>{
      l.img=nimg;
      l.x=ix; l.y=iy; l.w=cw; l.h=ch;
      l.baseW=cw; l.baseH=ch;
      renderLayers(); updateLayerBox(); updatePersistScale(); fitCanvas(); updateSizeLabel();
      hideCrop(); currentTool=null; renderSubBar(); updateToolActive();
      pushHistory(); toast('已裁切單張，格位保留');
    };
    nimg.src=tmp.toDataURL();
    return;
  }
  pushHistory();
  const tmp=document.createElement('canvas');
  tmp.width=Math.round(r.w); tmp.height=Math.round(r.h);
  tmp.getContext('2d').drawImage(main, r.x, r.y, r.w, r.h, 0,0, tmp.width, tmp.height);
  main.width=tmp.width; main.height=tmp.height;
  ocan.width=tmp.width; ocan.height=tmp.height;
  ctx.clearRect(0,0,main.width,main.height);
  ctx.drawImage(tmp,0,0);
  fitCanvas(); updateSizeLabel();
  hideCrop(); currentTool=null; renderSubBar(); updateToolActive();
  const url=main.toDataURL('image/png');
  history.push({url, snap:null, w:main.width, h:main.height}); histIdx=history.length-1; updateUndo();
  toast('已裁切');
}
// handle resize observer for crop box + layer box
new ResizeObserver(()=>{ if(cropState.active) updateCropBox(); if(selectedLayer>=0) updateLayerBox(); }).observe(wrap);

// Rotate / Flip（若有選中圖層則針對單張）
function rotate(deg){
  if(layers.length && selectedLayer>=0){
    layers[selectedLayer].rot = (layers[selectedLayer].rot + deg) % 360;
    renderLayers(); updateLayerBox(); pushHistory(); toast('已旋轉選中照片'); return;
  }
  if(layers.length){ renderLayers(); layers=[]; selectedLayer=-1; hideLayerBox(); }
  pushHistory();
  const tmp=document.createElement('canvas');
  const w=main.width, h=main.height;
  if(Math.abs(deg)===90){ tmp.width=h; tmp.height=w; } else { tmp.width=w; tmp.height=h; }
  const tctx=tmp.getContext('2d');
  tctx.translate(tmp.width/2, tmp.height/2);
  tctx.rotate(deg*Math.PI/180);
  tctx.drawImage(main, -w/2, -h/2);
  main.width=tmp.width; main.height=tmp.height;
  ocan.width=tmp.width; ocan.height=tmp.height;
  ctx.clearRect(0,0,main.width,main.height);
  ctx.drawImage(tmp,0,0);
  fitCanvas(); updateSizeLabel();
  const url=main.toDataURL('image/png');
  history.push({url, snap:null, w:main.width, h:main.height}); histIdx=history.length-1; updateUndo();
}
function flip(dir){
  if(layers.length && selectedLayer>=0){
    const l=layers[selectedLayer];
    const tmp=document.createElement('canvas'); tmp.width=l.img.width; tmp.height=l.img.height;
    const tctx=tmp.getContext('2d');
    tctx.translate(dir==='h'?tmp.width:0, dir==='v'?tmp.height:0);
    tctx.scale(dir==='h'?-1:1, dir==='v'?-1:1);
    tctx.drawImage(l.img,0,0);
    const nimg=new Image();
    nimg.onload=()=>{ l.img=nimg; renderLayers(); updateLayerBox(); pushHistory(); toast('已翻轉選中照片'); };
    nimg.src=tmp.toDataURL();
    // 先顯示等待，避免白畫面
    return;
  }
  if(layers.length){ renderLayers(); layers=[]; selectedLayer=-1; hideLayerBox(); }
  pushHistory();
  const tmp=document.createElement('canvas');
  tmp.width=main.width; tmp.height=main.height;
  const tctx=tmp.getContext('2d');
  tctx.translate(dir==='h'?tmp.width:0, dir==='v'?tmp.height:0);
  tctx.scale(dir==='h'?-1:1, dir==='v'?-1:1);
  tctx.drawImage(main,0,0);
  ctx.clearRect(0,0,main.width,main.height);
  ctx.drawImage(tmp,0,0);
  const url=main.toDataURL('image/png');
  history.push({url, snap:null, w:main.width, h:main.height}); histIdx=history.length-1; updateUndo();
}

// Mosaic pixelate
function applyMosaicAt(cx,cy, size){
  const s=size*2; // block size
  const x=Math.max(0, Math.round(cx - s*1.2)), y=Math.max(0, Math.round(cy - s*1.2));
  const w=Math.min(main.width - x, s*2.4), h=Math.min(main.height - y, s*2.4);
  if(w<=0||h<=0) return;
  // downscale then upscale
  const block = Math.max(6, Math.round(size*0.9));
  const smallW = Math.max(1, Math.round(w / block));
  const smallH = Math.max(1, Math.round(h / block));
  const tmp=document.createElement('canvas');
  tmp.width=smallW; tmp.height=smallH;
  const tctx=tmp.getContext('2d');
  // disable smoothing for pixel effect? actually want smoothing off for blocks
  tctx.imageSmoothingEnabled=false;
  tctx.drawImage(main, x,y,w,h, 0,0, smallW, smallH);
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(tmp, 0,0, smallW, smallH, x,y,w,h);
  ctx.imageSmoothingEnabled=true;
}

// Layout modal
const layoutModal=$('#layoutModal');
function openLayoutModal(){
  $('#layoutCount').textContent=pendingImages.length;
  selectedLayout='grid';
  selectedTemplate = pendingImages.length===2 ? '1x2' : pendingImages.length===3 ? '1x3' : '2x2';
  buildGridPick();
  layoutModal.classList.add('show');
}
$('#btnLayoutCancel').onclick=()=> layoutModal.classList.remove('show');
$('#btnFreeMode').onclick=()=>{
  selectedLayout='free';
  $('#gridTemplates').style.display='none';
  $('#btnFreeMode').style.background='#0ea5e9';
  $('#btnGridMode').style.background='#334155';
};
$('#btnGridMode').onclick=()=>{
  selectedLayout='grid';
  $('#gridTemplates').style.display='block';
  $('#btnGridMode').style.background='#0ea5e9';
  $('#btnFreeMode').style.background='#334155';
};
function buildGridPick(){
  const n=pendingImages.length;
  const templates=[
    {id:'1x2', label:'左右 2格', cols:2, rows:1},
    {id:'2x1', label:'上下 2格', cols:1, rows:2},
    {id:'2x2', label:'田字 4格', cols:2, rows:2},
    {id:'1x3', label:'橫向 3格', cols:3, rows:1},
    {id:'3x1', label:'直向 3格', cols:1, rows:3},
    {id:'1x4', label:'橫向 4格', cols:4, rows:1},
  ];
  const pick=$('#gridPick'); pick.innerHTML='';
  templates.forEach(t=>{
    // hide unsuitable for count? show all but suggest
    const card=document.createElement('div');
    card.className='pick-card'+(t.id===selectedTemplate?' selected':'');
    const total=t.cols*t.rows;
    let cells='';
    for(let i=0;i<total;i++) cells+=`<div>${i < n ? '圖'+(i+1) : ''}</div>`;
    card.innerHTML=`<div class="prev" style="grid-template-columns:repeat(${t.cols},1fr);grid-template-rows:repeat(${t.rows},1fr);display:grid">${cells}</div><h4>${t.label}</h4><div style="font-size:11px;color:#777">${t.cols} × ${t.rows}</div>`;
    card.onclick=()=>{ selectedTemplate=t.id; [...pick.children].forEach(c=>c.classList.remove('selected')); card.classList.add('selected'); };
    pick.appendChild(card);
  });
  $('#gridTemplates').style.display='block';
  $('#btnGridMode').style.background='#0ea5e9';
  $('#btnFreeMode').style.background='#334155';
}
$('#btnLayoutConfirm').onclick=()=>{
  layoutModal.classList.remove('show');
  originalImgs=pendingImages.slice(); originalMode=selectedLayout; originalTpl=selectedTemplate;
  initLayersFromImages(pendingImages, selectedLayout, selectedTemplate);
};
function buildGridLayout(tplId){
  const map={ '1x2':[2,1], '2x1':[1,2], '2x2':[2,2], '1x3':[3,1], '3x1':[1,3], '1x4':[4,1]};
  const [cols,rows]=map[tplId]||[2,1];
  const outW=1200, outH= Math.round(1200 * rows/cols * 0.85);
  main.width=outW; main.height=outH; ocan.width=outW; ocan.height=outH;
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,outW,outH);
  const gap=4;
  const cellW=(outW - gap*(cols+1))/cols;
  const cellH=(outH - gap*(rows+1))/rows;
  let idx=0;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const img=pendingImages[idx % pendingImages.length];
      const x=gap + c*(cellW+gap), y=gap + r*(cellH+gap);
      // cover
      const ir=img.width/img.height, cr=cellW/cellH;
      let dw, dh, dx, dy;
      if(ir > cr){ dh=cellH; dw=dh*ir; dx=x - (dw-cellW)/2; dy=y; } else { dw=cellW; dh=dw/ir; dx=x; dy=y - (dh-cellH)/2; }
      ctx.save(); ctx.beginPath(); ctx.rect(x,y,cellW,cellH); ctx.clip();
      ctx.drawImage(img, dx, dy, dw, dh);
      ctx.restore();
      idx++;
      if(idx>=pendingImages.length && pendingImages.length < cols*rows) break;
    }
  }
  hasImage=true; emptyHint.style.display='none';
  fitCanvas(); updateSizeLabel(); pushHistory();
  toast('拼貼完成');
}
function buildFreeLayout(){
  const outW=1200, outH=1200;
  main.width=outW; main.height=outH; ocan.width=outW; ocan.height=outH;
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,outW,outH);
  // place images with offsets
  const n=pendingImages.length;
  pendingImages.forEach((img,i)=>{
    const scale=Math.min(520/img.width, 520/img.height, 0.9);
    const w=img.width*scale, h=img.height*scale;
    const cols=Math.ceil(Math.sqrt(n));
    const col=i%cols, row=Math.floor(i/cols);
    const x= 40 + col*(520+40) + (520-w)/2;
    const y= 40 + row*(520+40) + (520-h)/2;
    // shadow
    ctx.save(); ctx.shadowColor='rgba(0,0,0,.18)'; ctx.shadowBlur=16; ctx.shadowOffsetY=8;
    ctx.fillStyle='#fff'; ctx.fillRect(x-4,y-4,w+8,h+8);
    ctx.restore();
    ctx.drawImage(img, x,y,w,h);
    // border
    ctx.strokeStyle='#e5e7eb'; ctx.lineWidth=1; ctx.strokeRect(x-4,y-4,w+8,h+8);
  });
  hasImage=true; emptyHint.style.display='none';
  fitCanvas(); updateSizeLabel(); pushHistory();
  toast('自由排列完成');
}

// Export
const exportModal=$('#exportModal');
function openExport(){
  if(!hasImage){ toast('請先載入照片'); return; }
  exportModal.classList.add('show');
  updateExpInfo();
  // share availability
  if(navigator.canShare && navigator.canShare({files:[new File([new Blob()], 'test.png', {type:'image/png'})]})){
    $('#btnDoShare').style.display='inline-block';
  } else if(navigator.share){
    $('#btnDoShare').style.display='inline-block';
  } else {
    $('#btnDoShare').style.display='none';
  }
}
$('#btnExportTop').onclick=openExport;
$('#btnExpCancel').onclick=()=> exportModal.classList.remove('show');
$('#expFormat').onchange=updateExpInfo;
$('#expQuality').oninput=()=>{ $('#qVal').textContent=$('#expQuality').value+'%'; updateExpInfo(); };
$('#expScale').oninput=()=>{ $('#sVal').textContent=$('#expScale').value+'%'; updateExpInfo(); };
function updateExpInfo(){
  const fmt=$('#expFormat').value, q=$('#expQuality').value, sc=$('#expScale').value;
  const w=Math.round(main.width*sc/100), h=Math.round(main.height*sc/100);
  $('#qVal').textContent=q+'%'; $('#sVal').textContent=sc+'%';
  $('#expInfo').textContent=`輸出尺寸：${w} × ${h} ｜ 格式：${fmt.split('/')[1].toUpperCase()} ｜ 品質：${q}%`;
}
$('#btnDoDownload').onclick=async()=>{
  const fmt=$('#expFormat').value, q=parseInt($('#expQuality').value)/100, sc=parseInt($('#expScale').value)/100;
  let c=main;
  if(sc!==1){
    const tmp=document.createElement('canvas');
    tmp.width=Math.round(main.width*sc); tmp.height=Math.round(main.height*sc);
    tmp.getContext('2d').drawImage(main,0,0,tmp.width, tmp.height);
    c=tmp;
  }
  const ext = fmt==='image/png' ? 'png' : fmt==='image/webp' ? 'webp' : 'jpg';
  c.toBlob(blob=>{
    if(!blob){ toast('輸出失敗'); return; }
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=`photo-edit-${Date.now()}.${ext}`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast('已下載');
    exportModal.classList.remove('show');
  }, fmt, fmt==='image/png'?undefined:q);
};
$('#btnDoShare').onclick=async()=>{
  const fmt=$('#expFormat').value, q=parseInt($('#expQuality').value)/100, sc=parseInt($('#expScale').value)/100;
  let c=main;
  if(sc!==1){
    const tmp=document.createElement('canvas');
    tmp.width=Math.round(main.width*sc); tmp.height=Math.round(main.height*sc);
    tmp.getContext('2d').drawImage(main,0,0,tmp.width, tmp.height);
    c=tmp;
  }
  const ext = fmt==='image/png' ? 'png' : fmt==='image/webp' ? 'webp' : 'jpg';
  c.toBlob(async blob=>{
    const file=new File([blob], `photo.${ext}`, {type:fmt});
    try{
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:'照片編輯輸出'});
      } else if(navigator.share){
        // fallback share url
        const url=URL.createObjectURL(blob);
        await navigator.share({title:'照片編輯', url});
        URL.revokeObjectURL(url);
      }
      toast('已分享');
    }catch(e){ if(e.name!=='AbortError') toast('分享取消或不支援'); }
  }, fmt, fmt==='image/png'?undefined:q);
};

// Init blank canvas placeholder
(function init(){
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,main.width,main.height);
  ctx.fillStyle='#e5e7eb'; ctx.font='14px sans-serif'; ctx.textAlign='center';
  ctx.fillText('請載入照片', main.width/2, main.height/2);
  // clear to white for export correctness, but keep hint overlay
  ctx.clearRect(0,0,main.width,main.height);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,main.width,main.height);
  fitCanvas();
})();

// 阻止頁面滑動/下拉刷新（彈窗與工具列保留捲動）
document.addEventListener('touchmove', e=>{
  const t=e.target;
  if(t && t.closest && (t.closest('.modal')||t.closest('#toolBar'))) return;
  e.preventDefault();
},{passive:false});

// 全螢幕切換
$('#btnFullscreen').onclick=()=>{
  const d=document, el=d.documentElement;
  const active=d.fullscreenElement||d.webkitFullscreenElement;
  if(!active){
    const fn=el.requestFullscreen||el.webkitRequestFullscreen;
    if(fn){
      try{
        const r=fn.call(el);
        if(r && r.catch) r.catch(()=>toast('瀏覽器拒絕全螢幕'));
        else toast('已進入全螢幕');
      }catch{ toast('此瀏覽器不支援全螢幕'); }
    } else {
      toast('iOS 請用分享選單「加入主畫面」，開啟即為全螢幕');
    }
  } else {
    (d.exitFullscreen||d.webkitExitFullscreen).call(d);
  }
};
if(!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen)){
  $('#btnFullscreen').textContent='⛶ 全螢幕說明';
}

// Fullscreen hint for PWA
if(window.matchMedia('(display-mode: standalone)').matches){
  document.body.style.paddingTop='env(safe-area-inset-top)';
}
})();
