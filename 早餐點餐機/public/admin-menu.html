<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>菜單管理</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="menu-admin">
    <div class="menu-header">
      <a href="admin.html" class="btn btn-secondary btn-sm" id="linkBack">← 返回後台</a>
      <h1>菜單管理</h1>
      <div class="menu-header-actions">
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('importExportSection').classList.toggle('open')">匯入匯出</button>
      </div>
    </div>

    <div id="loadingHint" style="display:none;text-align:center;padding:40px;color:var(--text-muted)">載入中...</div>

    <div class="menu-body" id="menuBody" style="display:none">
      <!-- Left: Categories -->
      <div class="menu-left">
        <div class="menu-left-header">
          <span>分類</span>
          <button class="btn btn-sm btn-primary" onclick="addCategoryInline()">+ 新增</button>
        </div>
        <div id="categoryFormArea"></div>
        <div id="categoryList"></div>
      </div>

      <!-- Right: Items -->
      <div class="menu-right">
        <div class="menu-right-header" id="itemsHeader">
          <span id="itemsTitle">請選擇左側分類</span>
          <div style="display:flex;gap:6px">
            <button class="btn btn-sm btn-secondary" id="btnSelectAddons" style="display:none" onclick="editCategoryAddons()">選擇配料</button>
            <button class="btn btn-sm btn-primary" id="btnAddItem" style="display:none" onclick="addItemInline()">+ 新增品項</button>
          </div>
        </div>
        <div id="itemFormArea"></div>
        <div id="itemList"></div>
      </div>
    </div>

    <!-- Import/Export (collapsed) -->
    <div class="admin-section">
      <button class="collapse-toggle" onclick="this.nextElementSibling.classList.toggle('open'); this.textContent = this.nextElementSibling.classList.contains('open') ? '▾ 匯入匯出' : '▸ 匯入匯出'">▸ 匯入匯出</button>
      <div class="collapse-content" id="importExportSection">
        <button class="btn btn-secondary" onclick="downloadTemplate()">下載空白 Excel 範本</button>
        <button class="btn btn-secondary" onclick="document.getElementById('excelUpload').click()">上傳 Excel</button>
        <input type="file" id="excelUpload" accept=".xlsx,.xls" style="display:none" onchange="handleExcelUpload(event)">
        <hr style="margin: 16px 0; border-color: var(--border);">
        <p style="margin-bottom: 8px;">貼上 JSON：</p>
        <textarea id="jsonInput" style="width:100%; height:150px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; font-family:monospace;"></textarea>
        <button class="btn btn-primary" onclick="importJSON()">匯入</button>
        <button class="btn btn-secondary" onclick="exportJSON()">匯出</button>
      </div>
    </div>
  </div>

  <!-- Addon Picker Modal -->
  <div class="modal-overlay" id="addonPickerModal" style="display:none">
    <div class="modal">
      <h2>選擇配料</h2>
      <div id="addonPickerList" class="addon-picker-list"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeAddonPicker()">取消</button>
        <button class="btn btn-primary" onclick="saveAddonPicker()">確認</button>
      </div>
    </div>
  </div>

    <!-- Addon Library (inline) -->
    <div class="admin-section" style="margin-top:16px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <h2 style="margin:0">配料庫</h2>
        <button class="btn btn-sm btn-secondary" id="btnToggleAddonEdit" onclick="toggleAddonEditMode()">編輯・刪除</button>
      </div>
      <div id="addonLibList" class="addon-chip-list"></div>
      <div class="inline-form-row" style="max-width:360px;margin-top:8px">
        <input type="text" class="inline-input" placeholder="加蛋-10、起司-15（名稱-價格）" id="newAddonName" style="flex:1" onkeydown="if(event.key==='Enter'){event.preventDefault();addAddonFromModal()}">
        <button class="btn btn-sm btn-primary" onclick="addAddonFromModal()">新增</button>
      </div>
    </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/config.js"></script>
  <script src="js/firebase-core.js"></script>
  <script src="js/theme.js"></script>
  <script>ThemeManager.init();</script>
  <script src="js/admin-menu.js"></script>
</body>
</html>
