<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>早餐點餐機</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/consumer.css">
</head>
<body>
  <div class="consumer-container">
    <!-- Header -->
    <header class="header">
      <div class="header-title" id="storeName">載入中...</div>
      <div class="header-actions">
        <button class="header-btn mode-toggle" id="modeToggle" onclick="toggleScrollMode()" title="切換滑動/固定">滑動</button>
        <a id="adminLink" href="#" class="header-btn" style="text-decoration:none" title="後台管理">⚙</a>
      </div>
    </header>

    <!-- Main: Sidebar + Items + Cart -->
    <div class="consumer-main">
      <!-- Categories -->
      <nav class="categories" id="categories"></nav>

      <!-- Items -->
      <main class="items-panel">
        <div class="items-grid" id="itemsGrid"></div>
        <!-- Addon Bar -->
        <div class="addon-bar" id="addonBar">
          <span class="addon-label" id="addonLabel">配料</span>
          <div class="addon-list" id="addonButtons"></div>
        </div>
      </main>

      <!-- Cart -->
      <aside class="cart-panel">
        <div class="cart-header">
          <h3>購物車 <span class="cart-count" id="cartCount">0</span></h3>
          <button class="btn-clear-cart" onclick="clearCart()">全部取消</button>
        </div>
        <div class="cart-items" id="cartItems"></div>
      <div class="cart-footer">
        <div class="cart-dine-row">
          <button class="dine-btn" id="btnDineIn" onclick="selectDineType('dine')">內用</button>
          <button class="dine-btn" id="btnTakeout" onclick="selectDineType('takeout')">外帶</button>
        </div>
        <div class="cart-total">
          <span class="cart-total-label">總計</span>
          <span class="cart-total-amount" id="cartTotal">$0</span>
        </div>
        <div class="cart-actions">
          <button class="cart-action-btn primary" id="btnConfirm" onclick="confirmOrder()">確認訂單</button>
        </div>
      </div>
      </aside>
    </div>

    <!-- Today's Orders -->
    <div class="today-orders" id="todayOrders">
      <div class="today-orders-header" onclick="openOrdersOverlay()">
        <span id="todayOrdersTitle">今日訂單 (0)</span>
        <span class="today-orders-toggle" id="todayOrdersToggle">▸</span>
      </div>
      <div class="today-orders-list" id="todayOrdersList" style="display:none"></div>
    </div>
  </div>

  <!-- Order Confirmation Modal -->
  <div class="modal-overlay" id="orderModal" style="display:none">
    <div class="modal">
      <h2>訂單確認</h2>
      <div id="modalDineType"></div>
      <div class="modal-items" id="modalItems"></div>
      <div class="modal-total" id="modalTotal"></div>
      <div class="modal-actions">
        <button class="cart-action-btn secondary" onclick="closeModal()">返回修改</button>
        <button class="cart-action-btn primary" onclick="submitOrder()">確認送出</button>
      </div>
    </div>
  </div>

  <!-- Cart Edit Modal -->
  <div class="modal-overlay" id="cartEditModal" style="display:none">
    <div class="modal">
      <h2 id="cartEditTitle">編輯品項</h2>
      <div id="cartEditAddons" class="cart-edit-addons"></div>
      <div class="modal-actions">
        <button class="cart-action-btn secondary" onclick="closeCartEdit()">取消</button>
        <button class="cart-action-btn primary" onclick="saveCartEdit()">儲存</button>
      </div>
    </div>
  </div>

  <!-- Today's Orders Fullscreen Overlay -->
  <div class="orders-overlay" id="ordersOverlay" style="display:none">
    <div class="orders-overlay-header">
      <button class="orders-overlay-back" onclick="closeOrdersOverlay()">← 返回菜單</button>
      <h2>今日訂單</h2>
    </div>
    <div class="orders-overlay-body">
      <div class="orders-section" id="pendingOrdersSection">
        <h3 class="orders-section-title">待處理</h3>
        <div id="pendingOrdersList"></div>
      </div>
      <div class="orders-section" id="completedOrdersSection">
        <h3 class="orders-section-title">已完成</h3>
        <div id="completedOrdersList"></div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="js/config.js"></script>
  <script src="js/firebase-core.js"></script>
  <script src="js/theme.js"></script>
  <script>ThemeManager.init();</script>
  <script src="js/stats-tracker.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/consumer.js"></script>
</body>
</html>
